[package]
name = "moonveil"
version = "0.0.1"
edition = "2024"
description = "A custom theme and design framework for iced."
license = "MIT"
repository = "https://github.com/bradysimon/moonveil"

[workspace]
members = ["examples/*"]

[features]
default = []
svg = ["iced_widget/svg"]

[dependencies]
iced_core = { version = "0.15.0-dev", git = "https://github.com/iced-rs/iced" }
iced_widget = { version = "0.15.0-dev", git = "https://github.com/iced-rs/iced", features = ["advanced"] }
iced_anim = { git = "https://github.com/bradysimon/iced_anim", branch = "iced/master", features = ["derive"] }

[dev-dependencies]
proptest = "1.7"
