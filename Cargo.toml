[package]
name = "moonveil"
version = "0.0.1"
edition = "2024"
description = "A custom theme and design framework for iced."
license = "MIT"
repository = "https://github.com/bradysimon/moonveil"

[workspace]
members = ["examples/*"]

[dependencies]
iced_core = { version = "0.15.0-dev", git = "https://github.com/iced-rs/iced", branch = "master" }
iced_widget = { version = "0.15.0-dev", git = "https://github.com/iced-rs/iced", branch = "master", features = ["advanced", "svg"] }
iced_anim = { git = "https://github.com/bradysimon/iced_anim", branch = "iced/master", features = ["derive"] }
iced_highlighter = { version = "0.15.0-dev", git = "https://github.com/iced-rs/iced", branch = "master", optional = true }

[features]
# Markdown parsing and rendering styled by Moonveil's theme.
markdown = ["iced_widget/markdown"]
# Syntax highlighting for Markdown code blocks and text editors, colored by Moonveil's theme.
highlighter = ["iced_widget/highlighter", "dep:iced_highlighter"]

[dev-dependencies]
proptest = "1.7"
